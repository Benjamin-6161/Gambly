name: Daily Parlay

on:
  schedule:
    - cron: "0 0 */3 * *"  # runs roughly every 3 days at midnight UTC
  workflow_dispatch:

jobs:
  run-script:
    if: false   # flip to true (or remove) once you've smoke-tested locally
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Download yesterday's database (predictions/results history)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true   # fine on the very first run, when no artifact exists yet
        with:
          workflow: send_scores.yml
          name: matches-db
          path: resources/db/
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run script
        run: python agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: matches-db
          path: resources/db/matches.db
